; RustOS GameMode settings (games started with rustos-game, "Run as game", or gamemoderun)
[general]
renice=10
softrealtime=auto
ioprio=0
inhibit_screensaver=1

[gpu]
; AMD: graphics card at full speed while a game runs (only when plugged in: rustos-game skips GameMode on battery)
apply_gpu_optimisations=accept-responsibility
gpu_device=0
amd_performance_level=high

[custom]
start=/usr/local/bin/rustos-performance game-start
end=/usr/local/bin/rustos-performance game-end
