name: Build RustOS ARM image (iPad / UTM)

# Run it by hand: Actions tab -> "Build RustOS ARM image" -> Run workflow.
# Run it AFTER the normal "Publish RustOS update repository" run is green (it needs the aarch64 repository).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y parted dosfstools e2fsprogs qemu-utils libarchive-tools curl gnupg util-linux
          df -h / /mnt /tmp || true
      - name: Build the disk image
        run: sudo -E bash arm/build-image.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rustos-arm64-image
          path: out/arm/*
          compression-level: 0
          retention-days: 14
